{% extends "base.html" %}

{% block title %}404 Not Found - SecureShop{% endblock %}

{% block content %}
<div style="background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 60px 20px; text-align: center; max-width: 600px; margin: 40px auto; box-shadow: var(--shadow);">
  <div style="font-size: 3.5rem; margin-bottom: 12px;">🔍</div>
  <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--dark); margin-bottom: 8px;">404 - Page Not Found</h1>
  <p style="color: var(--muted); margin-bottom: 24px;">
    The requested resource, product, or URL does not exist on the SecureShop local server.
  </p>
  <div style="display: flex; justify-content: center; gap: 12px;">
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Store</a>
    <a href="{{ url_for('products') }}" class="btn btn-secondary">Browse Catalogue</a>
  </div>
</div>
{% endblock %}
